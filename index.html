<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
</head>
<body style="background:#0a1628;color:white;font-family:Arial;text-align:center;padding:40px;">
<h1 style="color:#4fc3f7;">SAP EC Quiz</h1>
<p>Enter your name:</p>
<br>
<input type="text" id="nameBox" style="padding:14px;font-size:18px;border-radius:12px;border:2px solid #4fc3f7;background:#1a2a4a;color:white;width:80%;">
<br><br>
<button onclick="startApp()" style="padding:16px 40px;font-size:18px;background:#4fc3f7;color:#0a1628;border:none;border-radius:12px;font-weight:bold;">START</button>
<div id="result" style="margin-top:20px;font-size:20px;"></div>
<script>
function startApp() {
  var name = document.getElementById('nameBox').value;
  if (name.length < 2) {
    document.getElementById('result').textContent = 'Please enter at least 2 characters';
    return;
  }
  document.getElementById('result').textContent = 'Welcome, ' + name + '! App is working!';
}
</script>
</body>
</html>
